server.port=8080

# MySQL Database Connection (XAMPP default)
spring.datasource.url=jdbc:mysql://localhost:3306/ocean_view_resort?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepaliveTime=300000
spring.datasource.hikari.maxLifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Token Configuration
app.auth.tokenSecret=my-very-secret-key-for-jwt-token-generation-please-change-in-production-environment
app.auth.tokenExpiryMinutes=720